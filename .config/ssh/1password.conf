# 1Password の SSH エージェントを使う。
# ~/.ssh/config.d/1password.conf にリンクされ、~/.ssh/config の
# `Include ~/.ssh/config.d/*.conf` から読み込まれる (make ssh)。
#
# ソケットがあるときだけ有効にする。1Password が無いマシンでは何もしないので、
# 既定のエージェント (SSH_AUTH_SOCK) がそのまま使われる。
# 秘密鍵は 1Password の中にあり、このファイルにはソケットのパスしか書かない。

# macOS
Match exec "test -S '%d/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock'"
    IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

# Linux
Match exec "test -S '%d/.1password/agent.sock'"
    IdentityAgent "~/.1password/agent.sock"
