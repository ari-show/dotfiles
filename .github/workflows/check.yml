# 毎 push で `make check` を実行する。手元の `make check` と同じ内容
# （bootstrap/*.pm の構文チェック、nixfmt の整形チェック、全 system の評価、dotfiles-tools のビルド）。
name: Check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したら古い実行は止める。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: make check
        run: make check
