# flake.nix に version / hash を直書きしているパッケージ（Dependabot の対象外）の更新を確認する。
# 新しいバージョンがあれば nix-update で version / hash / vendorHash を書き換え、
# ビルドが通ったら PR を作る。ビルドに失敗した場合は workflow が失敗し、GitHub から通知が届く。
name: Update pinned Nix packages

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 手動で固定しているパッケージを追加したらここにも足す（flake の packages.<system>.<name>）。
        package: [ghtkn]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Run nix-update
        id: update
        working-directory: nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API の rate limit 回避
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          before="$(nix eval --raw ".#${PACKAGE}.version")"
          nix run --inputs-from . nixpkgs#nix-update -- --flake "${PACKAGE}"
          after="$(nix eval --raw ".#${PACKAGE}.version")"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          if [ "${before}" != "${after}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE}: ${before} -> ${after}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} is up to date (${before})"
          fi

      - name: Build updated package
        if: steps.update.outputs.changed == 'true'
        run: nix build "./nix#${{ matrix.package }}" --no-link

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/nix-update-${{ matrix.package }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          title: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          body: |
            `nix-update` で `${{ matrix.package }}` を更新しました（`${{ steps.update.outputs.before }}` -> `${{ steps.update.outputs.after }}`）。

            - `version` / `hash` / `vendorHash` を自動で書き換えています
            - `x86_64-linux` で `nix build ./nix#${{ matrix.package }}` が通ることを確認済みです

            マージ後、手元で `make nix-update` または `make nix-sync` を実行して profile に反映してください。
          labels: dependencies
