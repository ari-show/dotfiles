# Dependabot の対象外の固定パッケージを更新し、ビルドに成功したら PR を作る。
# ghtkn は Linux、cmux は Apple Silicon macOS で検証する。
name: Update pinned Nix packages

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 手動で固定しているパッケージを追加したらここにも足す（flake の packages.<system>.<name>）。
        package: [ghtkn]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Run nix-update
        id: update
        working-directory: nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API の rate limit 回避
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          before="$(nix eval --raw ".#${PACKAGE}.version")"
          nix run --inputs-from . nixpkgs#nix-update -- --flake "${PACKAGE}"
          after="$(nix eval --raw ".#${PACKAGE}.version")"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          if [ "${before}" != "${after}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE}: ${before} -> ${after}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} is up to date (${before})"
          fi

      - name: Build updated package
        if: steps.update.outputs.changed == 'true'
        run: nix build "./nix#${{ matrix.package }}" --no-link

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/nix-update-${{ matrix.package }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          title: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          body: |
            `nix-update` で `${{ matrix.package }}` を更新しました（`${{ steps.update.outputs.before }}` -> `${{ steps.update.outputs.after }}`）。

            - `version` / `hash` / `vendorHash` を自動で書き換えています
            - `x86_64-linux` で `nix build ./nix#${{ matrix.package }}` が通ることを確認済みです

            マージ後、手元で `make nix-update` または `make nix-sync` を実行して profile に反映してください。
          labels: dependencies

  cmux:
    concurrency:
      group: update-cmux
      cancel-in-progress: false
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check latest stable release
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-cmux
      - name: Build and smoke test on Apple Silicon
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build ./nix#cmux --out-link "$RUNNER_TEMP/cmux"
          "$RUNNER_TEMP/cmux/bin/cmux" --version
          "$RUNNER_TEMP/cmux/bin/cmux" config validate --path .config/cmux/cmux.json
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/update-cmux
          delete-branch: true
          sign-commits: true
          add-paths: nix/cmux-source.json
          commit-message: 'chore(cmux): update to ${{ steps.update.outputs.after }}'
          title: 'chore(cmux): update to ${{ steps.update.outputs.after }}'
          body: |
            cmux を ${{ steps.update.outputs.before }} から ${{ steps.update.outputs.after }} に更新します。

            - [リリースノート](https://github.com/manaflow-ai/cmux/releases/tag/v${{ steps.update.outputs.after }})
            - Apple Silicon macOS で Nix ビルドと CLI の起動・設定構文を確認済みです。
            - マージ後、`git pull` と `make nix-sync` で手元に反映してください。
          labels: dependencies
