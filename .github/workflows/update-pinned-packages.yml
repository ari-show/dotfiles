# Dependabot の対象外の固定パッケージを更新し、ビルドに成功したら PR を作る。
# ghtkn は Linux、cmux と Raycast は Apple Silicon macOS で検証する。
name: Update pinned Nix packages

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 手動で固定しているパッケージを追加したらここにも足す（flake の packages.<system>.<name>）。
        package: [ghtkn]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Run nix-update
        id: update
        working-directory: nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API の rate limit 回避
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          before="$(nix eval --raw ".#${PACKAGE}.version")"
          # タグではなく GitHub Releases を見て prerelease を除外し、正式版（vX.Y.Z）だけを対象にする。
          # ghtkn には誤って打たれた prerelease タグ v4.0.1-0 があり、タグ基準だとそれを拾ってしまう。
          nix run --inputs-from . nixpkgs#nix-update -- --flake "${PACKAGE}" \
            --use-github-releases \
            --version-regex '^v(\d+\.\d+\.\d+)$'
          after="$(nix eval --raw ".#${PACKAGE}.version")"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          if [ "${before}" != "${after}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE}: ${before} -> ${after}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} is up to date (${before})"
          fi

      - name: Build updated package
        if: steps.update.outputs.changed == 'true'
        run: nix build "./nix#${{ matrix.package }}" --no-link

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: deps/nix-update-${{ matrix.package }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          title: "chore(nix): update ${{ matrix.package }} ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          body: |
            `nix-update` で `${{ matrix.package }}` を更新しました（`${{ steps.update.outputs.before }}` -> `${{ steps.update.outputs.after }}`）。

            - `version` / `hash` / `vendorHash` を自動で書き換えています
            - `x86_64-linux` で `nix build ./nix#${{ matrix.package }}` が通ることを確認済みです

            マージ後、手元で `make nix-update` または `make nix-sync` を実行して profile に反映してください。
          labels: dependencies

  codex:
    concurrency:
      group: update-codex
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check latest stable release
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-codex
      - name: Build and smoke test on Linux
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build ./nix#codex --out-link "$RUNNER_TEMP/codex"
          "$RUNNER_TEMP/codex/bin/codex" --version
          test -x "$RUNNER_TEMP/codex/libexec/codex/bin/codex-code-mode-host"
          test -x "$RUNNER_TEMP/codex/libexec/codex/bin/codex-exec-server"
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: deps/update-codex
          delete-branch: true
          sign-commits: true
          add-paths: nix/codex-source.json
          commit-message: 'chore(codex): update to ${{ steps.update.outputs.after }}'
          title: 'chore(codex): update to ${{ steps.update.outputs.after }}'
          body: |
            Codex CLI を ${{ steps.update.outputs.before }} から ${{ steps.update.outputs.after }} に更新します。

            - [リリースノート](https://github.com/openai/codex/releases/tag/rust-v${{ steps.update.outputs.after }})
            - 公式リリースのビルド済みバイナリの SHA-256 を GitHub の asset digest から取得しています。
            - x86_64 Linux で Nix ビルドと `codex --version` を確認済みです。
            - マージ後、`git pull` と `make nix-sync` で手元に反映してください。
          labels: dependencies

  cmux:
    concurrency:
      group: update-cmux
      cancel-in-progress: false
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check latest stable release
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-cmux
      - name: Build and smoke test on Apple Silicon
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build ./nix#cmux --out-link "$RUNNER_TEMP/cmux"
          "$RUNNER_TEMP/cmux/bin/cmux" --version
          "$RUNNER_TEMP/cmux/bin/cmux" config validate --path .config/cmux/cmux.json
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: deps/update-cmux
          delete-branch: true
          sign-commits: true
          add-paths: nix/cmux-source.json
          commit-message: 'chore(cmux): update to ${{ steps.update.outputs.after }}'
          title: 'chore(cmux): update to ${{ steps.update.outputs.after }}'
          body: |
            cmux を ${{ steps.update.outputs.before }} から ${{ steps.update.outputs.after }} に更新します。

            - [リリースノート](https://github.com/manaflow-ai/cmux/releases/tag/v${{ steps.update.outputs.after }})
            - Apple Silicon macOS で Nix ビルドと CLI の起動・設定構文を確認済みです。
            - マージ後、`git pull` と `make nix-sync` で手元に反映してください。
          labels: dependencies

  raycast:
    concurrency:
      group: update-raycast
      cancel-in-progress: false
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check latest release
        id: update
        run: python3 scripts/update-raycast
      - name: Build and verify on Apple Silicon
        if: steps.update.outputs.changed == 'true'
        env:
          EXPECTED: ${{ steps.update.outputs.after }}
        run: |
          set -euo pipefail
          nix build ./nix#raycast --out-link "$RUNNER_TEMP/raycast"
          app="$RUNNER_TEMP/raycast/Applications/Raycast.app"
          # GUI アプリは CI で起動できないので、同梱の版番号と公式署名を確認する。
          # CFBundleVersion は 0 固定なので CFBundleShortVersionString（例: 2.12.1.0）を見る。
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::version mismatch: expected ${EXPECTED}, got ${actual}"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: deps/update-raycast-pin
          delete-branch: true
          sign-commits: true
          add-paths: nix/raycast-source.json
          commit-message: 'chore(raycast): update to ${{ steps.update.outputs.after }}'
          title: 'chore(raycast): update to ${{ steps.update.outputs.after }}'
          body: |
            Raycast を ${{ steps.update.outputs.before }} から ${{ steps.update.outputs.after }} に更新します。

            - [変更履歴](https://www.raycast.com/changelog)
            - Apple Silicon macOS で Nix ビルド、同梱の版番号、コード署名・公証を確認済みです。
            - マージ後、`git pull` と `make nix-sync` で手元に反映してください。
          labels: dependencies
