# macOS（aarch64-darwin）で `make check` を実行する。
# macOS の runner は遅いので、macOS でのビルド結果が変わりうるファイルを変えたときだけ動かす。
# Perl の構文チェックや全 system の評価は Ubuntu 側（check.yml）でも毎回行っている。
name: Check (macOS)

on:
  push:
    branches: ["**"]
    paths:
      - "nix/**"
      - "makefile"
      - ".github/workflows/check-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したら古い実行は止める。
concurrency:
  group: check-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # /nix/store はキャッシュしない。macOS の runner ではキャッシュの展開（約4分）が
      # cache.nixos.org などからの取得とビルド（約4分30秒〜5分）とほぼ同じ時間かかり、得にならないため。

      - name: make check
        run: make check
