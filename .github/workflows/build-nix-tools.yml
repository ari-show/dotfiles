name: Build Nix tools bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Compare artifact preparation methods on fresh runners
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-tools:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
        mode: ${{ fromJSON(inputs.benchmark && '["baseline", "xz-parallel", "zstd", "no-bundle"]' || '["baseline"]') }}
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Build installable tools package
        run: nix build ./nix#packages.${{ matrix.platform.system }}.dotfiles-tools --no-link -L

      - name: Copy closure into binary cache
        if: ${{ matrix.mode != 'no-bundle' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cache
          case '${{ matrix.mode }}' in
            baseline) options='' ;;
            xz-parallel) options='?compression=xz&parallel-compression=true' ;;
            zstd) options='?compression=zstd&parallel-compression=true' ;;
          esac
          nix copy --to "file://$PWD/dist/cache$options" ./nix#packages.${{ matrix.platform.system }}.dotfiles-tools
          nix path-info ./nix#packages.${{ matrix.platform.system }}.dotfiles-tools > dist/store-path.txt
          printf '%s\n' '${{ matrix.platform.system }}' > dist/system.txt
          echo "Cache disk usage: $(du -sh dist/cache | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package cache with gzip
        if: ${{ matrix.mode == 'baseline' || matrix.mode == 'xz-parallel' }}
        shell: bash
        run: |
          tar -C dist -czf dotfiles-tools-${{ matrix.platform.system }}.tgz cache store-path.txt system.txt
          echo "Bundle disk usage: $(du -h dotfiles-tools-${{ matrix.platform.system }}.tgz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package cache without gzip
        if: ${{ matrix.mode == 'zstd' }}
        shell: bash
        run: |
          tar -C dist -cf dotfiles-tools-${{ matrix.platform.system }}.tar cache store-path.txt system.txt
          echo "Bundle disk usage: $(du -h dotfiles-tools-${{ matrix.platform.system }}.tar | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline bundle
        if: ${{ matrix.mode == 'baseline' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-tools-${{ matrix.platform.system }}
          path: dotfiles-tools-${{ matrix.platform.system }}.tgz

      - name: Upload comparison bundle
        if: ${{ matrix.mode == 'xz-parallel' || matrix.mode == 'zstd' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-tools-${{ matrix.platform.system }}-${{ matrix.mode }}
          path: dotfiles-tools-${{ matrix.platform.system }}.*
          compression-level: 0
          retention-days: 1
