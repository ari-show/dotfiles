name: Build Nix tools bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tools:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build installable tools package
        run: |
          nix build ./nix#packages.${{ matrix.system }}.dotfiles-tools

      - name: Export Nix closure as portable artifact
        shell: bash
        run: |
          set -euo pipefail
          STORE_PATH="$(nix path-info ./nix#packages.${{ matrix.system }}.dotfiles-tools)"

          mkdir -p dist/cache
          nix copy --to "file://$PWD/dist/cache" ./nix#packages.${{ matrix.system }}.dotfiles-tools

          printf '%s\n' "${STORE_PATH}" > dist/store-path.txt
          printf '%s\n' "${{ matrix.system }}" > dist/system.txt

          tar -C dist -czf "dotfiles-tools-${{ matrix.system }}.tgz" cache store-path.txt system.txt

      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-tools-${{ matrix.system }}
          path: dotfiles-tools-${{ matrix.system }}.tgz
