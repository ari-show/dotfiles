version: 2
updates:
  # nix/flake.lock の inputs（nixpkgs / uv2nix など）。pkgs.* はここでまとめて上がる。
  - package-ecosystem: nix
    directory: /nix
    schedule:
      interval: weekly
    groups:
      nix-inputs:
        patterns: ["*"]

  # Omnigent の Python 依存（nix/omnigent/pyproject.toml / uv.lock）。
  - package-ecosystem: uv
    directory: /nix/omnigent
    schedule:
      interval: weekly
    # リリース直後の版（乗っ取られた版の可能性）をすぐ取り込まないよう、公開から 7 日待つ。
    cooldown:
      default-days: 7

  # workflow で使っている Actions。SHA で固定し、コメントの版番号ごと Dependabot が更新する。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
